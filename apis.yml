aid: quadric
name: Quadric
description: >-
  Quadric is a semiconductor IP company based in Burlingame, California that
  licenses the Chimera GPNPU (general-purpose neural processing unit) processor
  IP and its accompanying software stack for on-device and edge AI inference.
  The Chimera architecture unifies scalar, vector, and matrix compute in a single
  fully C++ programmable core so both AI graph operators and classic DSP/C++ code
  run on one pipeline, giving SoC designers a future-proof target for evolving
  model roadmaps. Quadric ships a developer toolchain rather than a hosted web
  API: the cloud-based DevStudio portal, the Chimera SDK (ONNX import from PyTorch
  and TensorFlow), the ChiPy Python programming interface, an LLVM-based C++
  extensibility path, and an instruction-set simulator for pre-silicon performance
  modeling. This profile catalogs Quadric's developer surface for the API
  Evangelist network.
